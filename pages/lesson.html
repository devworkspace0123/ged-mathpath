<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GED Math Lesson | MathPath</title>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [
                    ["$", "$"],
                    ["\\(", "\\)"]
                ],
                displayMath: [
                    ["$$", "$$"],
                    ["\\[", "\\]"]
                ]
            },
            svg: {
                fontCache: "global"
            }
        };
    </script>

    <script
        defer
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>

    <link
        rel="stylesheet"
        href="../styles/lessons-markdown.css"
    >
</head>

<body>
    <main class="lesson-page">
        <article class="lesson-content"></article>
    </main>

    <script
        type="module"
        src="../scripts/lessons-markdown.js">
    </script>
</body>
</html>
